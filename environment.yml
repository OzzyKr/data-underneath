# Conda environment for the lithology pipeline, API and tests.
# Create:  conda env create -f environment.yml
# Exact resolved versions are recorded in environment.lock.yml (regenerate with `make lock`).
name: lithology
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # core pipeline
  - numpy>=2.0
  - pillow>=10.4
  - scipy>=1.13
  - scikit-image>=0.24
  - scikit-learn>=1.5
  - pandas>=2.2
  - pyarrow>=16
  - pyyaml>=6
  # tier 2 second opinion (conda-forge build shares one OpenMP runtime with numpy/scikit-learn)
  - pytorch>=2.4
  - torchvision>=0.19
  # dashboard back end (Stage 2)
  - duckdb>=1.1
  - fastapi>=0.115
  - uvicorn>=0.30
  - python-dotenv>=1.0
  - python-multipart>=0.0.9
  # dev tooling
  - pytest>=8
  - ruff>=0.6
  - pip:
      - opencv-python-headless>=4.10
      - ruptures>=1.1.9
      - pytesseract>=0.3.13
      - anthropic>=2.6         # Insights AI (any one provider is enough)
      - openai>=1.90
      - -e .
