# Every tunable number in the pipeline lives here, in physical units (ft) or as a fraction of a box.
# Change values here, never in code. The config hash is recorded with every result.

scale:
  n_windows: 14              # OCR windows spread down the depth column
  window_ft: 120             # height of each OCR window, in ft (converted with the filename/DPI estimate)
  window_px_fallback: 1600   # window height when no scale estimate exists
  min_text_px: 22            # upscale a crop so OCR text is at least roughly this tall
  min_points: 4              # OCR depth labels needed before trusting a fit
  ransac_residual_ft: 3.0    # a label further than this from the fit is an outlier
  max_slope_disagreement: 0.15  # |px_per_ft OCR / filename-DPI - 1| above this lowers confidence
  piecewise_break_ft: 25.0   # if a global line misses inliers by more than this, use piecewise knots
  max_depth_ft: 45000        # deepest plausible label (the deepest wells drilled are ~40,000 ft)

segment:
  core_width_fraction: 0.6   # analyse the central part of the column, away from border lines and text
  # coarse pass: colour + pattern (works on black-and-white logs too)
  block_ft: 1.0              # descriptor block height
  min_block_px: 12           # but never shorter than this (pattern periods are ~10-40 px)
  min_thickness_ft: 2.0      # thinnest bed the coarse pass reports
  penalty: 3.0               # change-point penalty (on noise-scaled block descriptors)
  refine_window_ft: 1.5      # boundary refinement search radius around a block edge
  # fine pass: background colour only (thin beds in colour logs; inert on black-and-white logs)
  colour_block_ft: 0.25
  colour_min_block_px: 3
  colour_min_thickness_ft: 0.5  # thinnest bed reported at all (single pattern rows ~0.7 ft exist)
  colour_min_px: 6           # ...and at least this many pixel rows (resolution floor on 1 in/100 ft logs)
  colour_sliver_ft: 1.0      # beds thinner than this are kept only between two layers of the same rock
  colour_penalty: 3.0
  ink_luma: 110              # pixels darker than this (0-255) count as pattern ink / lines
  blank_ink_fraction: 0.004  # a block with less ink than this AND near-white fill is blank paper
  blank_fill_luma: 240
  snap_to_gap: true         # same-fill (pattern) boundaries go to the blank gap between the two patterns' marks

cluster:
  distance_threshold: 0.6    # agglomerative merge threshold (weighted RMS distance in noise units)
  colour_weight: 2.0         # colour carries more weight than texture when both are present

legend:
  min_label_chars: 2
  max_swatch_gap_frac: 0.06  # max gap between a swatch and its label, as a fraction of legend width
  min_swatch_px: 8           # ignore specks smaller than this in either dimension
  ocr_min_conf: 30

naming:
  abstain: false                   # true: write unresolved_label; false: write the best guess, flagged with a low
                                   # confidence and a "could not differentiate: A or B?" note (Unresolved always
                                   # scores as wrong when teams are ranked on correctness)
  unresolved_label: Unresolved     # CSV name for groups computer vision cannot tell apart
  classical_decisive_margin: 1.0   # runner-up must be this much further away (fixed-scale distance units)
  pretrained_decisive_margin: 0.07 # winner's cosine similarity must beat the runner-up by this much
  template_min_score: 0.85         # pixel template match this good means "drawn with this exact swatch"...
  template_decisive_margin: 0.05   # ...when it also beats the runner-up by this much
  confidence_agree: 0.9
  confidence_one_sure: 0.6
  confidence_unresolved: 0.2      # a best guess between candidates computer vision could not separate
  confidence_lookalike: 0.4        # a guess settled by a look-alike rule (plainest variant, or the commoner rock)
  # Tie-break between legend entries drawn pixel-identically (e.g. Clay and Shale in some b&w legends): the picture
  # cannot decide, so the more common rock in mud logs is written. An explicit prior, named in the bed's note.
  common_rocks: [shale, sandstone, limestone, siltstone, claystone, dolomite, marl, anhydrite, halite, chalk, coal]
  colour_gate: 12.0                # a best guess must have the bed's fill colour (Lab distance) when any swatch does
  use_strokes: true                # stroke-shape opinion (scale-invariant; from a teammate's prototype) joins the
                                   # best-guess vote for groups no opinion settled

checks:
  min_thickness_ft: 0.5      # beds thinner than this get lower confidence
  depth_monotonic: true

render:
  max_height_px: 20000       # annotated image is shrunk so it is at most this tall
  coverage: 0.5              # fraction of the lithology column painted with the prediction
  min_width_px: 900          # tall logs are shrunk vertically more than horizontally so labels stay readable

runtime:
  workers: 3                 # at most this many documents in parallel (each in its own process)...
  memory_budget_mb: 6000     # ...and only while their estimated peak memory fits here (8 GB machine). The estimate
                             # is read from the image header before decoding: huge logs run alone, small ones together.

ai:
  tier: 2                    # 1 = classical only; 2 = + local pretrained second opinion (measured to help
                             #     on black-and-white logs); 3 = + cloud LLM
  provider: none             # none | openai | gemini (tier 3 only)

layout:                      # STEP 1 of the pipeline: find the depth column, lithology column and legend on the page
  source: auto               # auto: use the annotation file when there is one, detect the boxes when there is not;
                             # detect: always detect (bonus / end-to-end evaluation); annotation: same as auto
                             # annotation: use the organisers' boxes when a file exists, detect otherwise (A/B only)
  body_samples: 3000         # rows sampled down the page to find where the long track rules run
  body_gap_in: 0.15          # breaks in the track rules shorter than this are bridged (wider merges the header table)
  header_search_in: 3.0      # the header's bottom rule is searched this far below where the track rules begin
  header_max_in: 45.0        # never OCR more header than this
  depth_bands: 5             # body bands OCR'd across the full width for depth numbers
  depth_band_in: 2.0         # height of each band
  depth_cluster_in: 0.12     # numbers closer than this in x belong to the same track
  min_track_mm: 2.5          # narrowest depth / lithology track
  depth_snap_in: 0.3         # snap a depth box edge to a vertical rule only this close to the labels
  max_track_mm: 25.0         # widest interpreted lithology track
  legend_title_bonus: 0.4    # a "Lithology symbols" / "Legend" / "Rock types" title in a header cell
  legend_unsnapped_penalty: 0.3  # a rock-word cluster no header frame holds (often spans the accessory list too)
  lith_header_bonus: 3.0     # a "Lithology" / "Interp. Lith" header word above a track (strongest cue, AUROC 0.81)
  lith_negative_header_penalty: 2.0  # a "Cuttings" / "% Lith" / "Description" header above a track
  lith_palette_merge_de: 15.0  # legend colours closer than this (Lab dE) are one colour class when counting colours
  lith_shade_min: 0.35         # a fill pixel darkened by a hatch's anti-aliased edge down to this shade keeps its colour
  lith_shade_bias: 0.1         # per unit of darkening, so a legend colour that is itself dark wins its own pixels
  lith_constant_share: 0.95  # a track whose rows share one dominant colour more often than this is a constant strip
  lith_constant_penalty: 1.5  # ranking penalty for a fully constant strip (soft: a one-rock log can still win)
