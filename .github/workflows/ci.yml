name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Tesseract OCR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install package
        run: pip install -e ".[dev,api]"

      - name: Lint
        if: runner.os == 'Linux'
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (synthetic; dataset tests skip without the private data)
        run: pytest -q
